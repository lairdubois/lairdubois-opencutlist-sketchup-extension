    objective_details:
      default: |
        Îmbunătățirea continuă a *OpenCutList* este importantă pentru noi și proiectul continuă să aibă nevoie de ajutorul dvs. pentru următoarea sa actualizare!
      cuttingdiagram_export: |
        Este important pentru noi ca *OpenCutList* să poată fi adaptat așteptărilor foarte diferite ale utilizatorilor pentru funcția de *diagramă de tăiere*.
        Pentru a extinde și mai mult posibilitățile, am dori să activăm exportul diagramelor în format **SVG** și **DXF**.
        Oferindu-ne mijloacele de a lucra la aceste exporturi, ne oferiți oportunitatea de a vă ajuta să obțineți la maximum ce-i mai bun din *OpenCutList*.

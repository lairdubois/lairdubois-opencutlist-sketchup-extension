    write:
      title: Izvoz dijelova
      info_2d: |
        Ovaj modul omogućuje izvoz **2D projekcije** dijelova kao datoteka u formatu [SVG](https://wikipedia.org/wiki/Scalable_Vector_Graphics) ili [DXF](https://wikipedia.org/wiki/AutoCAD_DXF).
      info_3d: |
        Ovaj modul omogućuje izvoz **3D geometrije** dijelova kao datoteka u formatu [STL](https://wikipedia.org/wiki/STL_(file_format)) ili [OBJ](https://wikipedia.org/wiki/Wavefront_.obj_file).
      option_file_format: Format
      option_file_format_help: |
        Omogućuje odabir formata datoteke za izvoz.
      option_dxf_structure: DXF struktura
      option_dxf_structure_1: Razine
      option_dxf_structure_2: Razine + blokovi
      option_dxf_structure_help: |
        Omogućuje odabir strukture DXF datoteke.

        - Struktura **Razine** crta sve linije ravno, razlikujući vrste linija samo pomoću razina. *Ova struktura nudi bolju kompatibilnost s drugim programima.*
        - Struktura **Razine + blokovi** stvara jedan blok po dijelu i umeće te blokove onoliko puta koliko se dijelovi ponavljaju. *Ova struktura nudi veću fleksibilnost za uređivanje datoteke.*
      option_dxf_depth_to_z: Dubine po Z
      option_dxf_depth_to_z_0: $t(default.no)
      option_dxf_depth_to_z_1: Rasporedi dubine razina po osi Z
      option_dxf_depth_to_z_help: |
        Omogućuje raspoređivanje razina po osi Z prema njihovoj dubini.

        Isključite ovu opciju za izvoz DXF-a samo u 2D.
      option_unit: Jedinica
      option_unit_help: |
        Omogućuje odabir jedinice koja se koristi u izvezenoj datoteci.
      option_use_count: Količine
      option_use_count_0: Jedna datoteka po dijelu
      option_use_count_1: Jedna datoteka po instanci dijela
      option_use_count_help: |
        Omogućuje odabir uzima li se u obzir broj instanci dijela.
      option_part_drawing_type: Projekcija
      option_part_drawing_type_help: |
        Omogućuje odabir pogleda za izvoz.
      option_faces: Plohe
      option_faces_0: Koristi samo ciljanu plohu
      option_faces_1: Koristi sve plohe dijela
      option_faces_help: |
        Omogućuje odabir traži li se oblik dijela na svim njegovim plohama ili samo na ciljanoj plohi.
      option_anchor: Točka sidrenja
      option_anchor_0: Automatski
      option_anchor_1: Projiciraj ishodište dijela
      option_anchor_help: |
        **Automatski**
        Donji lijevi kut obuhvatnog okvira izvezene geometrije koristi se kao točka sidrenja.

        **Projiciraj ishodište dijela**
        Omogućuje projekciju ishodišta osi dijela kao točke sidrenja.
      option_switch_yz: Okomita os
      option_switch_yz_0: Z okomito
      option_switch_yz_1: Y okomito
      option_switch_yz_help: |
        Omogućuje zamjenu osi Y i Z radi određivanja okomite osi dijela.
      option_smoothing: Zaglađivanje
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Zagladi krugove i lukove (eksperimentalno)
      option_smoothing_help: |
        Omogućuje prepoznavanje krugova i lukova.

        *Ova opcija ne prepoznaje druge vrste krivulja.*
      option_merge_holes: Rastavljanje
      option_merge_holes_0: Osnovno
      option_merge_holes_1: Obris + provrti + prepust
      option_merge_holes_help: |
        **Osnovno**
        Oblik dijela izvozi se s projekcijom svake plohe na razinu koja odgovara njezinoj dubini.

        **Obris + provrti + prepust**
        Uključuje odvajanje vanjskog obrisa dijelova od njihovih provrta te izračun prepusta obrade primijenjenog na površine uz rub obrisa i šupljina.
      option_merge_holes_overflow: Prepust obrade
      option_merge_holes_overflow_help: |
        Omogućuje određivanje udaljenosti prepusta obrade primijenjenog na površine uz rub obrisa i šupljina.
      option_include_paths: Putanje
      option_include_paths_0: $t(default.no)
      option_include_paths_1: Koristi bridove koji nisu povezani s plohom
      option_include_paths_help: |
        Omogućuje korištenje bridova koji nisu povezani s plohom, a nalaze se u dijelu, kako bi se izvezli kao putanja.
      option_parts: Dijelovi
      option_parts_help: |
        Omogućuje odabir boja dijelova.
      option_parts_depths: Šupljine
      option_parts_depths_help: |
        Omogućuje odabir boja šupljina dijelova.

        *Prema zadanim postavkama koristi se prijelaz boja proporcionalan dubini šupljine, između boje dijelova i boje provrta.*
      option_parts_holes: Provrti
      option_parts_holes_help: |
        Omogućuje odabir boja provrta dijelova.
      option_parts_paths: Putanje
      option_parts_paths_help: |
        Omogućuje odabir boja putanja.

        *Boja ispune koristit će se samo za zatvorene putanje.*

      option_anchor_0: Автоматично
      option_anchor_1: Проектиране на началната точка на детайла
      option_anchor_help: |
        **Автоматично**
        Долният ляв ъгъл на обхващащия правоъгълник на експортираната геометрия се използва като точка на закотвяне.

        **Проектиране на началната точка на детайла**
        Активира проектирането на началото на осите на детайла като точка на закотвяне.
      option_switch_yz: Вертикална ос
      option_switch_yz_0: Z вертикална
      option_switch_yz_1: Y вертикална
      option_switch_yz_help: |
        Разменя осите Y и Z, за да определи вертикалната ос на детайла.
      option_smoothing: Изглаждане
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Изглаждане на окръжности и дъги (експериментално)
      option_smoothing_help: |
        Активира откриването на окръжности и дъги.

        *Тази опция не открива други видове криви.*
      option_merge_holes: Режим на обединяване
      option_merge_holes_0: Основен
      option_merge_holes_1: Контур + пробиви + добавка
      option_merge_holes_help: |
        **Основен**
        Формата на детайла се експортира с проекцията на всяка повърхност в слой, съответстващ на нейната дълбочина.

        **Контур + отвори + добавка**
        Активира отделянето на външния контур на детайлите от техните отвори, както и изчисляването на добавката за обработка, приложена към повърхностите, граничещи с контура и вдлъбнатините.
      option_merge_holes_overflow: Добавка за обработка
      option_merge_holes_overflow_help: |
        Позволява да зададете разстоянието на добавката за обработка, приложена към повърхностите по ръба на контурите и вдлъбнатините.

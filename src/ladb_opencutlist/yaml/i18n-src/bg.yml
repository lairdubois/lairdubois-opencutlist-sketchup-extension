      info_2d: |
        Този модул позволява да експортирате 2D **проекцията** на детайлите като файлове във формат [SVG](https://wikipedia.org/wiki/Scalable_Vector_Graphics) или [DXF](https://wikipedia.org/wiki/AutoCAD_DXF).
      info_3d: |
        Този модул позволява да експортирате **3D геометрията** на детайлите като файлове във формат [STL](https://wikipedia.org/wiki/STL_(file_format)) или [OBJ](https://wikipedia.org/wiki/Wavefront_.obj_file).
      option_file_format: Формат
      option_file_format_help: |
        Позволява да изберете формата на експортирания файл.
      option_dxf_structure: Структура на DXF
      option_dxf_structure_1: Слоеве
      option_dxf_structure_2: Слоеве + блокове
      option_dxf_structure_help: |
        Позволява да изберете структурата на DXF файла.

        - Структурата **Слоеве** чертае всички линии плоско, като различава типовете линии само чрез слоеве. *Тази структура предлага по-добра съвместимост със софтуер на трети страни.*
        - Структурата **Слоеве + блокове** създава по един блок за всеки детайл и вмъква тези блокове толкова пъти, колкото се повтарят детайлите. *Тази структура предлага по-голяма гъвкавост при редактиране на файла.*
      option_dxf_depth_to_z: Дълбочини по Z
      option_dxf_depth_to_z_0: $t(default.no)

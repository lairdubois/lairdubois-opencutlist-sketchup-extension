        Следователно,
        - *Дължина* е по <span style='color:red'>червената</span>ос
        - *Ширина* е по <span style='color:green'>зелената</span> ос
        -*Дебелина* е по <span style='color:blue'>синята</span>ос
      symmetrical: Деактивиране на откриването на огледален на този детайл
      symmetrical_help: |

      thickness_layer_count: Брой на слоевете
      thickness_layer_count_help: |
        Тук дефинирайте броя на слоевете, които разделят детайла по дебелината му.

        *Пример:* Ако имате проектиран детайл с дебелина *38 мм* и искате да го направите чрез залепване на два панела с дебелина *19 мм*, въведете **2** в това поле.

        Позволява детайла да се разглежда като *пакет* от един или повече *елементи*.
        Следователно количеството, свързано с детайла в списъка с детайли, ще представлява броя на целите пакети, необходими за получаване на броя на елементите, които действително присъстват в модела.

        *Пример : За да се брои само 1 брой за чифт водачи за чекмеджета:
        Опаковка = 2 единици / брой*
      instance_count_by_part_1: 1 единица за брой
      instance_count_by_part_2: 2 единици за брой

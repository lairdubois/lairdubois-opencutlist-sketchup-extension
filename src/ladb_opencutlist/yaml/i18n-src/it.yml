    write:
      title: Esportazione elementi
      info_2d: |
        Questo modulo permette di esportare la **proiezione 2D** degli elementi in un file in formato [SVG](https://it.wikipedia.org/wiki/Scalable_Vector_Graphics) oppure [DXF](https://it.wikipedia.org/wiki/AutoCAD_DXF).
      info_3d: |
        Questo modulo permette di esportare la **geometria 3D** degli elementi in un file in formato [STL](https://en.wikipedia.org/wiki/STL_(file_format)) oppure [OBJ](https://en.wikipedia.org/wiki/Wavefront_.obj_file).
      option_file_format: Formato
      option_file_format_help: |
        Permette di scegliere il formato del file da esportare.
      option_dxf_structure: Struttura DXF
      option_dxf_structure_1: Layer
      option_dxf_structure_2: Layer + Blocchi
      option_dxf_structure_help: |
        Permette di scegliere la struttura del file DXF.

        - La struttura **Layer** disegna tutti i tracciati in piano distinguendo i diversi tipi di tratto solo tramite i layer. *Questa struttura offre una migliore compatibilità con i software di terze parti.*
        - La struttura **Layer + Blocchi** crea un blocco per ogni pezzo e inserisce questi blocchi tante volte quanti sono i pezzi ripetuti. *Questa struttura offre maggiore flessibilità per modificare il file.*
      option_dxf_depth_to_z: Profondità in Z
      option_dxf_depth_to_z_0: $t(default.no)
      option_dxf_depth_to_z_1: Distribuisci le profondità dei layer lungo l'asse Z
      option_dxf_depth_to_z_help: |
        Consente di attivare la distribuzione dei layer lungo l'asse Z in base alla loro profondità.

        Disattiva questa opzione per esportare un DXF solo in 2D.
      option_unit: Unità
      option_unit_help: |
        Permette di scegliere l'unità di misura utilizzata nel file esportato.
      option_use_count: Quantità
      option_use_count_0: Un file per ogni parte
      option_use_count_1: Un file per istanza di parte
      option_use_count_help: |
        Permette di scegliere se considerare il numero di istanze di una parte.
      option_part_drawing_type: Proiezione
      option_part_drawing_type_help: |
        Permette di scegliere la vista da esportare.
      option_faces: Facce
      option_faces_0: Utilizza solo la faccia di destinazione
      option_faces_1: Utilizza tutte le facce dell'elemento
      option_faces_help: |
        Permette di scegliere se la ricerca della forma della parte viene eseguita su tutte le sue facce o solo sulla faccia puntata.
      option_anchor: Punto di aggancio
      option_anchor_0: Automatico
      option_anchor_1: Proietta l'origine del pezzo
      option_anchor_help: |
        **Automatico**
        L'angolo inferiore sinistro del perimetro che ingloba la geometria esportata è utilizzato come punto di aggancio.

        **Proiettare l'origine del pezzo**
        Permette di utilizzare la proiezione dell'origine degli assi del pezzo come punto di aggancio.
      option_switch_yz: Asse verticale
      option_switch_yz_0: Z verticale
      option_switch_yz_1: Y verticale
      option_switch_yz_help: |
        Permette di scambiare gli assi Y e Z per definire l'asse verticale della parte.
      option_smoothing: Morbidezza
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Levigatura di archi e cerchi (Sperimentale)
      option_smoothing_help: |
        Abilita l'individuazione degli archi e dei cerchi

        *Questa opzione non rileva altri tipi di curve.*
      option_merge_holes: Scomposizione
      option_merge_holes_0: Base
      option_merge_holes_1: Profilo + Forature + Sovrametallo
      option_merge_holes_help: |
        **Base**
        La forma del pezzo viene esportata con la proiezione di ciascuna faccia su un livello corrispondente alla sua profondità.

        **Profilo + Forature + Sovrametallo**
        Attiva la separazione del contorno esterno delle parti dai loro fori e il calcolo del sovrametallo applicato alle superfici situate ai margini del contorno e delle cavità.
      option_merge_holes_overflow: Abbondanza di lavorazione
      option_merge_holes_overflow_help: |
        Consente di definire la distanza di sporgenza di lavorazione applicata alle superfici situate ai margini del contorno e delle cavità.
      option_include_paths: Percorsi
      option_include_paths_0: $t(default.no)
      option_include_paths_1: Utilizzare bordi non associati a una faccia
      option_include_paths_help: |
        Consente di esportare come tracciato i bordi non associati a una faccia contenuta nella parte.
      option_parts: Parti
      option_parts_help: |
        Permette di scegliere i colori delle parti.
      option_parts_depths: Cavità
      option_parts_depths_help: |
        Permette di scegliere i colori delle cavità delle parti.

        *Per impostazione predefinita, il colore utilizzato è un gradiente proporzionale alla profondità della cavità tra il colore dei pezzi e quello dei fori.*
      option_parts_holes: Forature
      option_parts_holes_help: |
        Permette di scegliere i colori delle forature delle parti.
      option_parts_paths: Percorsi
      option_parts_paths_help: |
        Permette di scegliere i colori dei tracciati.

        *Il colore di riempimento verrà utilizzato solo per i tracciati chiusi.*

      std_thicknesses_help: |
        ضخامت‌های **خام** استاندارد موجود برای این متریال.

        *اگر واحدی مشخص نشود، واحد مدل اعمال می‌شود.*
      std_sections: مقطع‌های استاندارد
      std_sections_help: |
        مقطع‌های استاندارد موجود برای این متریال.

        *اگر واحدی مشخص نشود، واحد مدل اعمال می‌شود.*
      std_sizes: اندازه‌های استاندارد
      std_sizes_help: |
        اندازه‌های استاندارد موجود برای این متریال.

        *اگر واحدی مشخص نشود، واحد مدل اعمال می‌شود.*
      grained: الیاف
      grained_help: جهت الیاف را نسبت به طول ورق انتخاب می‌کند.
      grained_0: بدون جهت الیاف
      grained_1: جهت الیاف در راستای طول است
      edge_decremented: کاهش ابعاد
      edge_decremented_help: به شما امکان می‌دهد مشخص کنید آیا ابعاد قطعات باید به‌اندازهٔ ضخامت لبه‌چسبان کاهش یابد.
      edge_decremented_0: بدون کاهش
      edge_decremented_1: کاهش به‌اندازهٔ ضخامت لبه‌چسبان
      raw_estimated: حجم مورد استفاده
      raw_estimated_help: |
        به شما امکان می‌دهد حجمی را که برای برآورد وزن و هزینهٔ کل قطعات ساخته‌شده از این متریال استفاده می‌شود تعیین کنید.

        **حجم مؤثر**
        حجم کل برابر مجموع حجم‌های مؤثر قطعات خواهد بود که همان جعبهٔ محیطی شامل اضافه‌اندازه‌هاست.

        **حجم ماده‌اولیهٔ مورد نیاز**
        حجم کل برابر مجموع حجم ورق‌ها، شاخه‌ها یا لبه‌چسبان‌های قطعات پس از محاسبهٔ نقشهٔ برش خواهد بود.
      raw_estimated_0: حجم مؤثر
      raw_estimated_1: حجم ماده‌اولیهٔ مورد نیاز
      multiplier_coefficient: ضریب
      multiplier_coefficient_help: برای تعیین ضریب ضربی که به حجم ناخالص اعمال می‌شود به کار می‌رود.
      machining_separated: هندسه‌های ماشین‌کاری
      machining_separated_help: |
        به شما امکان می‌دهد نحوهٔ خروجی دوبعدی (DXF، SVG) هندسه‌های ماشین‌کاری این متریال را تعیین کنید.

        **$t(tab.materials.edit_material.machining_separated_0)**
        هندسه‌های ماشین‌کاری از شکل قطعه کسر و با لایه‌های عمقی آن ادغام می‌شوند، گویی عملیات جسم در هندسهٔ قطعه انجام شده است.
        *هندسه‌های ماشین‌کاری بیرون‌زده بریده می‌شوند.*

        **$t(tab.materials.edit_material.machining_separated_1)**
        قطعه شکل اصلی خود را حفظ می‌کند. هر هندسهٔ ماشین‌کاری همان‌گونه که هست، بدون ادغام با دیگران، روی یک لایهٔ `MACHININGS` برای هر عمق، به نام متریال خروجی گرفته می‌شود.
      machining_separated_0: حکاکی‌شده در قطعه
      machining_separated_1: جدا روی لایه‌های مخصوص خود
      machining_material_colored: رنگ‌ها برای خروجی
      machining_material_colored_help: |
        به شما امکان می‌دهد رنگ عملیات ماشین‌کاری جداشده را در خروجی‌های دوبعدی (DXF، SVG) تعیین کنید.

        **$t(tab.materials.edit_material.machining_material_colored_1)**

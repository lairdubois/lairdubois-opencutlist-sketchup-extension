        توجه کنید: اگر پیش‌تنظیمی با همین نام از قبل وجود داشته باشد، با نسخهٔ واردشده جایگزین می‌شود.
        فایل‌های موجود در آرشیو **.oclp** در همان مکانی که در کتابخانهٔ فرستنده داشتند، در کتابخانهٔ شما کپی می‌شوند.

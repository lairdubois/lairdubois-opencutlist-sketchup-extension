        اگر پیش‌تنظیم‌های انتخاب‌شده به فایل‌های **.skp** یا **.skm** ارجاع دهند، این فایل‌ها در یک آرشیو **.oclp** گنجانده می‌شوند تا خروجی بتواند همان‌گونه که هست به اشتراک گذاشته شود.

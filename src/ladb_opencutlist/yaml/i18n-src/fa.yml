          خوانده‌شده: {{ old_precision }}
          خروجی: {{ new_precision }}

          آیا می‌خواهید از دقت جدید استفاده کنید؟
    write:
      title: خروجی قطعات
      info_2d: |
        این ماژول به شما امکان می‌دهد **تصویر دوبعدی** قطعات را به‌صورت فایل‌هایی با قالب [SVG](https://wikipedia.org/wiki/Scalable_Vector_Graphics) یا [DXF](https://wikipedia.org/wiki/AutoCAD_DXF) خروجی بگیرید.
      info_3d: |
        این ماژول به شما امکان می‌دهد **هندسهٔ سه‌بعدی** قطعات را به‌صورت فایل‌هایی با قالب [STL](https://wikipedia.org/wiki/STL_(file_format)) یا [OBJ](https://wikipedia.org/wiki/Wavefront_.obj_file) خروجی بگیرید.
      option_file_format: قالب
      option_file_format_help: |
        به شما امکان می‌دهد قالب فایل خروجی را انتخاب کنید.
      option_dxf_structure: ساختار DXF
      option_dxf_structure_1: لایه‌ها
      option_dxf_structure_2: لایه‌ها + بلوک‌ها
      option_dxf_structure_help: |
        به شما امکان می‌دهد ساختار فایل DXF را انتخاب کنید.

        - ساختار **لایه‌ها** همهٔ مسیرها را تخت ترسیم می‌کند و انواع مختلف خط را فقط با لایه‌ها از هم متمایز می‌کند. *این ساختار سازگاری بیشتری با نرم‌افزارهای دیگر دارد.*
        - ساختار **لایه‌ها + بلوک‌ها** برای هر قطعه یک بلوک می‌سازد و این بلوک‌ها را به تعداد تکرار قطعات درج می‌کند. *این ساختار انعطاف بیشتری برای ویرایش فایل دارد.*
      option_dxf_depth_to_z: عمق‌ها در Z
      option_dxf_depth_to_z_0: $t(default.no)
      option_dxf_depth_to_z_1: توزیع عمق لایه‌ها در راستای محور Z
      option_dxf_depth_to_z_help: |
        توزیع لایه‌ها در راستای محور Z را بر اساس عمق آن‌ها فعال می‌کند.

        برای خروجی DXF دوبعدی صرف، این گزینه را غیرفعال کنید.
      option_unit: واحد
      option_unit_help: |
        به شما امکان می‌دهد واحد مورد استفاده در فایل خروجی را انتخاب کنید.
      option_use_count: تعداد
      option_use_count_0: یک فایل برای هر قطعه
      option_use_count_1: یک فایل برای هر نمونهٔ قطعه
      option_use_count_help: |
        به شما امکان می‌دهد انتخاب کنید آیا تعداد نمونه‌های یک قطعه در نظر گرفته شود.
      option_part_drawing_type: تصویر
      option_part_drawing_type_help: |
        به شما امکان می‌دهد نمایی را که باید خروجی گرفته شود انتخاب کنید.
      option_faces: سطوح
      option_faces_0: فقط از سطح هدف استفاده شود
      option_faces_1: از همهٔ سطوح قطعه استفاده شود
      option_faces_help: |
        به شما امکان می‌دهد انتخاب کنید جست‌وجوی شکل قطعه روی همهٔ سطوح آن انجام شود یا فقط روی سطح هدف.
      option_anchor: نقطهٔ لنگر
      option_anchor_0: خودکار
      option_anchor_1: تصویر مبدأ قطعه
      option_anchor_help: |
        **خودکار**
        گوشهٔ پایین سمت چپ جعبهٔ محیطی هندسهٔ خروجی به‌عنوان نقطهٔ لنگر استفاده می‌شود.

        **تصویر مبدأ قطعه**
        تصویر مبدأ محور قطعه را به‌عنوان نقطهٔ لنگر فعال می‌کند.
      option_switch_yz: محور عمودی
      option_switch_yz_0: Z عمودی
      option_switch_yz_1: Y عمودی
      option_switch_yz_help: |
        محورهای Y و Z را جابه‌جا می‌کند تا محور عمودی قطعه تعیین شود.
      option_smoothing: هموارسازی
      option_smoothing_0: $t(default.no)
      option_smoothing_1: هموارسازی دایره‌ها و کمان‌ها (آزمایشی)
      option_smoothing_help: |
        تشخیص دایره‌ها و کمان‌ها را فعال می‌کند.

        *این گزینه انواع دیگر منحنی را تشخیص نمی‌دهد.*
      option_merge_holes: حالت ادغام
      option_merge_holes_0: ساده
      option_merge_holes_1: دورخط + سوراخ‌ها + اضافه‌اندازه
      option_merge_holes_help: |
        **ساده**
        شکل قطعه همراه با تصویر هر سطح روی لایه‌ای متناسب با عمق آن خروجی گرفته می‌شود.

        **دورخط + سوراخ‌ها + اضافه‌اندازه**
        جداسازی دورخط بیرونی قطعات از سوراخ‌هایشان و نیز محاسبهٔ اضافه‌اندازهٔ ماشین‌کاری اعمال‌شده بر سطوح مجاور دورخط و حفره‌ها را فعال می‌کند.
      option_merge_holes_overflow: اضافه‌اندازهٔ ماشین‌کاری
      option_merge_holes_overflow_help: |
        به شما امکان می‌دهد فاصلهٔ اضافه‌اندازهٔ ماشین‌کاری اعمال‌شده بر سطوح لبهٔ دورخط‌ها و حفره‌ها را تعیین کنید.
      option_include_paths: مسیرها
      option_include_paths_0: $t(default.no)
      option_include_paths_1: استفاده از لبه‌های مرتبط‌نبوده با سطح
      option_include_paths_help: |
        استفاده از لبه‌هایی را که با هیچ سطحی مرتبط نیستند و در قطعه وجود دارند فعال می‌کند تا به‌صورت مسیر خروجی گرفته شوند.
      option_parts: قطعات
      option_parts_help: |
        به شما امکان می‌دهد رنگ قطعات را انتخاب کنید.
      option_parts_depths: حفره‌ها
      option_parts_depths_help: |
        به شما امکان می‌دهد رنگ حفره‌های قطعه را انتخاب کنید.

        *به‌طور پیش‌فرض، رنگ استفاده‌شده طیفی متناسب با عمق حفره بین رنگ قطعات و رنگ سوراخ‌هاست.*
      option_parts_holes: سوراخ‌ها
      option_parts_holes_help: |
        به شما امکان می‌دهد رنگ سوراخ‌های ایجادشده در قطعات را انتخاب کنید.
      option_parts_paths: مسیرها
      option_parts_paths_help: |
        به شما امکان می‌دهد رنگ مسیرها را انتخاب کنید.

        *رنگ پرکننده فقط برای مسیرهای بسته استفاده می‌شود.*
      error:
        no_part: قطعه‌ای برای خروجی گرفتن وجود ندارد.
      warning:
        is_group_selection: قطعات موجود در **گروه‌های پنهان** لیست قطعات خروجی گرفته نمی‌شوند.
        is_part_selection: خروجی به **قطعات انتخاب‌شده** محدود است.

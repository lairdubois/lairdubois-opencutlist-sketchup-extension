        اگر فقط از گروه استفاده می‌کنید، آن‌ها را به کامپوننت تبدیل کنید.
        استفاده از کامپوننت امکان تکرار قطعات یکسان را بدون کپی‌کردن آن‌ها فراهم می‌کند.
      no_typed_materials: به قطعاتی که باید در لیست قطعات بیایند یک متریال اعمال کنید و نوع این متریال (**$t(tab.materials.type_1)**، **$t(tab.materials.type_2)**، **$t(tab.materials.type_3)** یا **$t(tab.materials.type_5)**) را در زبانهٔ <i class="ladb-opencutlist-icon-materials"></i> **متریال‌ها** تعریف کنید.

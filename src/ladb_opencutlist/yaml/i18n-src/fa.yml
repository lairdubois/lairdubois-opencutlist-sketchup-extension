      no_typed_materials_in_model: مدل شما از هیچ متریالی با نوع تعریف‌شده (**$t(tab.materials.type_1)**، **$t(tab.materials.type_2)**، **$t(tab.materials.type_3)** یا **$t(tab.materials.type_5)**) استفاده نمی‌کند.

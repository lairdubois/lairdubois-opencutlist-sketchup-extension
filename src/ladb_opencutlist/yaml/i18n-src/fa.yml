      thickness_increase: اضافه‌اندازهٔ ضخامت
      thickness_increase_help: اضافه‌اندازه‌ای که به ضخامت نهایی قطعه اعمال می‌شود تا **ضخامت خام** آن تعیین شود.
      thickness_increase_help_plural: اضافه‌اندازه‌ای که به ضخامت نهایی قطعات اعمال می‌شود تا **ضخامت خام** آن‌ها تعیین شود.

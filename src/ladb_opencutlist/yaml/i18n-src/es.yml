        Si se selecciona esta opción, la designación de las piezas se extraerá del atributo *Name*, si está definido.

        <i class='ladb-opencutlist-icon-warning'></i> Las instancias de piezas con la misma definición se separarán si el atributo *Name* no tiene el mismo valor.

        Si esta opción está habilitada, las piezas de **material Madera Maciza, Tablero o Listón** de **mismo tamaño**, con **los mismos distintivos** y **la misma superficie terminada** *(si la visualización de esta superficie no está oculta)* se agruparán en la misma línea en la *lista de piezas*.


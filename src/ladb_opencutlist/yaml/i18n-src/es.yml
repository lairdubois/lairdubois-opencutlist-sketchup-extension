    write:
      title: Exportación de piezas
      info_2d: |
        Este módulo permite exportar la **proyección 2D** de las piezas como archivos de formato [SVG](https://wikipedia.org/wiki/Scalable_Vector_Graphics) o [DXF](https://wikipedia.org/wiki/AutoCAD_DXF).
      info_3d: |
        Este módulo permite exportar la **geometría 3D** de las piezas en ficheros de formato [STL](https://wikipedia.org/wiki/STL_(file_format)) o [OBJ](https://wikipedia.org/wiki/Wavefront_.obj_file).
      option_file_format: Formato
      option_file_format_help: |
        Permite elegir el formato de exportación del archivo.
      option_dxf_structure: Estructura DXF
      option_dxf_structure_1: Capas
      option_dxf_structure_2: Capas + Bloques
      option_dxf_structure_help: |
        Permite elegir la estructura del archivo DXF:

        - La estructura **Capas** dibuja todos los trazos en plano distinguiendo los diferentes tipos de trazo únicamente por las capas. *Esta estructura ofrece una mejor compatibilidad con los programas de terceros.*
        - La estructura **Capas + Bloques** crea un bloque por pieza e inserta estos bloques tantas veces como se repiten las piezas. *Esta estructura ofrece mayor flexibilidad para modificar el archivo.*
      option_dxf_depth_to_z: Profundidades en Z
      option_dxf_depth_to_z_0: $t(default.no)
      option_dxf_depth_to_z_1: Distribuir las profundidades de las capas en Z
      option_dxf_depth_to_z_help: |
        Permite activar la distribución de las capas en el eje Z según su profundidad.

        Desactive esta opción para exportar un DXF solo en 2D.
      option_unit: Unidad
      option_unit_help: |
        Permite elegir la unidad empleada en el archivo exportado.
      option_use_count: Cantidades
      option_use_count_0: Un fichero por pieza
      option_use_count_1: Un fichero por cada instancia de una misma pieza
      option_use_count_help: |
        Permite elegir si se tiene en cuenta el número de instancias de una pieza.
      option_part_drawing_type: Proyección
      option_part_drawing_type_help: |
        Permite elegir la vista exportada.
      option_faces: Caras
      option_faces_0: Utilizar únicamente la cara seleccionada
      option_faces_1: Utilizar todas las caras de la pieza
      option_faces_help: |
        Permite elegir si la búsqueda de la forma de la pieza se realiza en todas sus caras o únicamente en la seleccionada.
      option_anchor: Punto de anclaje
      option_anchor_0: Automático
      option_anchor_1: Proyectar el origen de la pieza
      option_anchor_help: |
        **Automático**
        La esquina inferior izquierda de la caja que contiene la geometría exportada se usa como punto de anclaje.

        **Proyectar el origen de la pieza**
        Permite activar la proyección del origen de los ejes de la pieza como punto de anclaje.
      option_switch_yz: Eje vertical
      option_switch_yz_0: Z vertical
      option_switch_yz_1: Y vertical
      option_switch_yz_help: |
        Conmuta los ejes Y y Z para definir el eje vertical de la pieza.
      option_smoothing: Suavizado
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Alisar los círculos y arcos (Experimental)
      option_smoothing_help: |
        Permite activar la detección de círculos y arcos.

        *Esta opción no permite detectar otros tipos de curva.*
      option_merge_holes: Descomposición
      option_merge_holes_0: Básico
      option_merge_holes_1: Contorno + perforaciones + reborde
      option_merge_holes_help: |
        **Básico**
        La forma de la pieza se exporta con la proyección de cada cara en una capa según su profundidad.

        **Contorno + Perforaciones + Reborde**
        Activa la separación del reborde exterior de las piezas de sus perforaciones, así como el cálculo del reborde de mecanizado aplicado a las superficies que se encuentran junto al perímetro y los huecos.
      option_merge_holes_overflow: Reborde de mecanizado
      option_merge_holes_overflow_help: |
        Permite definir la distancia del reborde de mecanizado aplicado a las superficies junto al borde y en torno a los huecos.
      option_include_paths: Trazados
      option_include_paths_0: $t(default.no)
      option_include_paths_1: Utilizar aristas no asociadas a una cara
      option_include_paths_help: |
        Permite utilizar las aristas contenidas en la pieza que no están asociadas a una cara, para exportarlas como trazado.
      option_parts: Piezas
      option_parts_help: |
        Permite elegir el color de las piezas.
      option_parts_depths: Huecos
      option_parts_depths_help: |
        Permite elegir los colores de los huecos de las piezas.

        *Por defecto, el color empleado es un degradado proporcional a la profundidad del hueco entre el color de las piezas y el de las perforaciones.*
      option_parts_holes: Perforaciones
      option_parts_holes_help: |
        Permite elegir el color de las perforaciones de las piezas.
      option_parts_paths: Trazados
      option_parts_paths_help: |
        Permite elegir los colores de los contornos.

        *El color de relleno sólo se utilizará para los contornos cerrados.*

      reset_global_presets_success: |
        *OpenCutList* presets have been reset.
        In order to reflect the changes, you must **close** and **reopen** the OpenCutList window.
      reset_model_presets: Reset model settings
      reset_model_presets_confirm: |
        You are about to reset all *OpenCutList* settings for the current model.

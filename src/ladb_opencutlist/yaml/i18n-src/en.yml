      option_dxf_structure_1: Layers
      option_dxf_structure_2: Layers + Blocks
      option_dxf_structure_help: |
        Selects the DXF file structure.

        - The **Layers** structure draws all lines flat, distinguishing between different line types using layers only. *This structure offers greater compatibility with third-party software.*
        - The **Layers + Blocks** structure creates one block per part and inserts these blocks as many times as the parts are repeated. *This structure offers more flexibility for editing the file.*

        mandatory: Required fields
        optional: Optional fields
        name: Designation
        count: Quantity
        bbox_length: Finished length
        bbox_width: Finished width
        bbox_thickness: Finished thickness
        material: Material
        tags: Badges
      tooltip:
        errors: This part will not be imported because it produced the following errors
        warnings: This part will be imported but it produced the following warnings
      error:

      option_part_drawing_type: Projection
      option_part_drawing_type_help: |
        Selects the view to be exported.
      option_faces: Faces
      option_faces_0: Use target face only
      option_faces_1: Use all faces of the part
      option_faces_help: |
        Allows you to choose whether the search for the shape of the part is to be carried out on all its faces or only on the target face.
      option_anchor: Anchor Point
      option_anchor_0: Automatic
      option_anchor_1: Project the part's origin
      option_anchor_help: |
        **Automatic**
        The lower left corner of the exported geometry's bounding box is used as anchor point.

        **Project the part's origin**
        Enables the projection of the part axis origin as anchor point.
      option_switch_yz: Vertical Axis
      option_switch_yz_0: Z vertical
      option_switch_yz_1: Y vertical
      option_switch_yz_help: |
        Swaps the Y and Z axes to define the vertical axis of the part.
      option_smoothing: Smoothing
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Smooth circles and arcs (Experimental)
      option_smoothing_help: |
        Enables the detection of circles and arcs.

        *This option does not detect other types of curves.*
      option_merge_holes: Merging Mode
      option_merge_holes_0: Basic
      option_merge_holes_1: Outline + Drillings + Allowance
      option_merge_holes_help: |
        **Basic**
        The shape of the part is exported with the projection of each face onto a layer corresponding to its depth.

        **Outline + Holes + Allowance**
        Activates the separation of the outer contour of parts from their holes, as well as the calculation of the machining allowance applied to surfaces bordering the contour and cavities.
      option_merge_holes_overflow: Machining Allowance
      option_merge_holes_overflow_help: |
        Allows you to set the machining overhang distance applied to surfaces at the edges of contours and cavities.
      option_include_paths: Paths
      option_include_paths_0: $t(default.no)
      option_include_paths_1: Use edges not associated with a face
      option_include_paths_help: |
        Enables the use of edges not associated with a face and contained in the part, to export them as a path.
      option_parts: Parts
      option_parts_help: |
        Selects the color of parts.
      option_parts_depths: Cavities
      option_parts_depths_help: |
        Allows you to choose the color of the part cavities.

        *By default, the color used is a gradient proportional to the depth of the cavity between the color of the parts and that of the holes.*
      option_parts_holes: Holes
      option_parts_holes_help: |
        Selects the color of drillings.
      option_parts_paths: Paths
      option_parts_paths_help: |
        Allows you to choose the path colors.

        *The fill color will only be used for closed paths.*

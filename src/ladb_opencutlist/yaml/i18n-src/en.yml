        failed_to_import: The import failed.
      success:
        imported_title: Import done
    csv:
      label: CSV
      title: Import Parts
      help: |
        This page allows you to import parts (defined by a rectangular bounding box) into your model from a [CSV](https://en.wikipedia.org/wiki/Comma-separated_values) file.
        You may then use the features of *OpenCutList* for parts that have been generated by a software other than *SketchUp*.

        Click the **Open CSV file** button to start.
      load:
        title: CSV File Upload
        info_0: |
          Select the options required to properly read the file:
          **{{ filename }}**.
        info_1: |
          *The unit configured in the model is: **{{ unit }}**.
          This unit will be used for dimensions without a specified unit*.
        options: Loading Options
        option_col_sep: Separator
        option_col_sep_tab: Tab
        option_col_sep_comma: Comma
        option_col_sep_semicolon: Semicolon
        option_first_line_headers: Header Line
        option_first_line_headers_0: Data
        option_first_line_headers_1: Column Titles
      import:
        title: Import Parts into the Model
        info_0: |
          You are about to import **{{ count }} part** into the model.
          This part will be placed in a group at the origin of the main scene.
        info_0_plural: |
          You are about to import **{{ count }} parts** into the model.
          These parts will be stacked in a group starting at the origin of the main scene.
        info_1: Click **Import** to confirm the action.
        options: |
          The model already contains *parts*, *definitions* or *materials*.
          Select the desired import options.
        option_remove_all_?: What should I do?
        option_remove_all_false: Add parts to the existing ones
        option_remove_all_true: Delete everything!
        option_keep_definitions_settings: Keep definition settings
        option_keep_materials_settings: Keep material settings
      column:

      export_global_presets_success_with_assets: The presets were successfully exported, along with {{ count }} associated file(s).
      import_global_presets: Import presets
      import_global_presets_help: |
        Select the presets from the **.json** or **.oclp** file that you want to import.
        Please note: if a preset with the same name already exists, it will be replaced by the imported version.
        The files contained in an **.oclp** archive are copied to your library, in the same location they occupied in the sender's library.

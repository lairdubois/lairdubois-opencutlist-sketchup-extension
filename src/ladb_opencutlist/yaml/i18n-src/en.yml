          You are about to import a configuration of **{{ count }} cabinet** into the model.
        info_0_plural: |
          You are about to import a configuration of **{{ count }} cabinets** into the model.
        info_1: You'll have the option to specify its location in the active model.
        materials: Materials
        layers: Tags
        geometry: Geometry
        option_parts_formula: Formula

          Unable to load the CSV file: **{{ error }}**
          *Verify that you have selected the appropriate field separator.*
        empty_file: The file appears to be empty or cannot be read properly.
        no_importable_part: No part can be imported. Assign the required fields to the corresponding columns.
        invalid_name: Invalid designation
        invalid_length: Invalid length
        invalid_width: Invalid width
        invalid_thickness: Invalid thickness

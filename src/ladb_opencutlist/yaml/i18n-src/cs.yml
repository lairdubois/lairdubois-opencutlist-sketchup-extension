    write:
      title: Export dílů
      info_2d: |
        Tento modul umožňuje exportovat **2D projekci** dílů jako soubory v [SVG](https://wikipedia.org/wiki/Scalable_Vector_Graphics) nebo [DXF](https://wikipedia.org/wiki/AutoCAD_DXF) formátu.
      info_3d: |
        Tento modul umožňuje exportovat **3D geometrii** dílů jako soubory v [STL](https://wikipedia.org/wiki/STL_(file_format)) nebo [OBJ](https://wikipedia.org/wiki/Wavefront_.obj_file) formátu.
      option_file_format: Formát
      option_file_format_help: |
        Vyberte formát exportovaného souboru.
      option_dxf_structure: DXF Struktura
      option_dxf_structure_1: Vrstvy
      option_dxf_structure_2: Vrstvy + bloky
      option_dxf_structure_help: |
        Vyberte strukturu souboru DXF.

        - Struktura **Vrstvy** vykresluje všechny čáry naplocho, přičemž rozlišuje mezi různými typy čar pouze pomocí vrstev. *Tato struktura nabízí větší kompatibilitu se softwarem třetích stran.*
        - Struktura **Vrstvy + Bloky** vytváří jeden blok na díl a vkládá tyto bloky tolikrát, kolikrát se díly opakují. *Tato struktura nabízí větší flexibilitu pro úpravy souboru.*
      option_dxf_depth_to_z: Hloubky v Z
      option_dxf_depth_to_z_0: $t(default.no)
      option_dxf_depth_to_z_1: Rozložit hloubky vrstev v ose Z
      option_dxf_depth_to_z_help: |
        Umožňuje zapnout rozložení vrstev v ose Z podle jejich hloubky.

        Vypněte tuto volbu pro export pouze 2D DXF.
      option_unit: Jednotka
      option_unit_help: |
        Vyberte jednotky použité u exportovaného souboru.
      option_use_count: Množství
      option_use_count_0: Jeden soubor na díl
      option_use_count_1: Jeden soubor na stejné díly
      option_use_count_help: |
        Vyberte, zda se zohlední počet stejných dílů.
      option_part_drawing_type: Projekce
      option_part_drawing_type_help: |
        Vyberte pohled, který chcete exportovat.
      option_faces: Plochy
      option_faces_0: Použít pouze označenou plochu
      option_faces_1: Použít všechny plochy dílu
      option_faces_help: |
        Umožňuje zvolit, zda se má hledání tvaru dílu provádět na všech jejích plochách nebo pouze na označené ploše.
      option_anchor: Kotevní bod
      option_anchor_0: Automatický
      option_anchor_1: Promítnout počátek dílu
      option_anchor_help: |
        **Automaticky**
        Levý dolní roh ohraničujícího rámečku exportované geometrie se použije jako kotevní bod.

        **Promítnout počátek souřadnic dílů**
        Umožňuje promítnout počátek osy dílu jako kotevní bod.
      option_switch_yz: Vertikální osa
      option_switch_yz_0: Z vertikální
      option_switch_yz_1: Y vertikální
      option_switch_yz_help: |
        Prohoďte osy Y a Z a definujte vertikální osu dílů.
      option_smoothing: Vyhlazení
      option_smoothing_0: $t(default.no)
      option_smoothing_1: Hladké kruhy a oblouky (Experimentální)
      option_smoothing_help: |
        Vyberte, zda mají být detekovány kruhy a oblouky.

        *Tato možnost detekuje jiné typy křivek.*
      option_merge_holes: Režim sloučení
      option_merge_holes_0: Základní
      option_merge_holes_1: Obrys + Vrtání + Přesah
      option_merge_holes_help: |
        **Základní**
        Tvar součásti je exportován s projekcí každé plochy na vrstvu odpovídající její hloubce.

        **Kontura + Vrtání + Přesah**
        Aktivuje oddělení vnější kontury součásti od jejich otvorů a také výpočet přepadu obrábění aplikovaného na plochy ohraničující konturu a dutiny.
      option_merge_holes_overflow: Přesah
      option_merge_holes_overflow_help: |
        Nastavuje vzdálenost přesahu, která se má použít na povrchy hraničící s konturami a dírami.

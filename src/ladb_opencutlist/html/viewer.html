<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .hide {
            display: none;
        }
        .pin {
            font-family: sans-serif;
            font-size: 10px;
            background-color: #ffffff;
            border: 1px solid #000000;
            min-height: 18px;
            line-height: 18px;
            text-align: center;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .pin-rounded {
            border-radius: 9px;
            padding: 0 2px;
            min-width: 14px;
        }
        .pin-squared {
            border-radius: 0;
            padding: 0 4px;
            min-width: 10px;
        }
        .bench-pin {
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            min-width: 18px;
            padding: 0;
            border-radius: 10px;
            opacity: 0.85;
            pointer-events: none;
        }
        .bench-pin-highlighted {   /* Not by transform : CSS2DRenderer sets it */
            opacity: 1;
            font-size: 13px;
            min-width: 24px;
            line-height: 24px;
            border-radius: 13px;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.2);
        }
        .dim {
            font-family: sans-serif;
            font-size: 10px;
            background-color: #ffffff;
            min-height: 18px;
            line-height: 18px;
            padding: 0 4px;
            border-radius: 4px;
        }
        .bench-dim {
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="../css/ladb-opencutlist-icons.min.css">
</head>
<body>
<script src="../js/bundles/viewer-bundle.js"></script>
</body>
</html>
